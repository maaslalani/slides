name: 🧪 Snap Builds

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'snap/**'
      - '.github/workflows/test-snap-can-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: canonical/setup-lxd@v1

      - name: Build snap
        id: build
        env:
          SNAPCRAFT_BUILD_INFO: 1
        run: |
          sudo snap install snapcraft --classic
          snapcraft pack
          echo "snap=$(ls *.snap)" >> "$GITHUB_OUTPUT"

      - uses: snapcrafters/ci/review-snap@main
        with:
          snap: ${{ steps.build.outputs.snap }}
          is-classic: 'false'
